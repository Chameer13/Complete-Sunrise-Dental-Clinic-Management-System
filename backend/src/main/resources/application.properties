spring.application.name=sunrise-dental-backend

server.port=8080

# ============================================================
# H2 DATABASE
# ============================================================

spring.datasource.url=jdbc:h2:file:./data/sunrise_dental_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# H2 CONSOLE
# ============================================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# SWAGGER
# ============================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET:SunriseDentalClinic-ChangeThisSecretKey-2026-AtLeast32Characters}
jwt.expiration-ms=86400000

# ============================================================
# APPLICATION
# ============================================================

app.frontend-url=http://localhost:5173

# ============================================================
# EMAIL
# ============================================================

app.mail.enabled=true
app.mail.from=petzysystem@gmail.com

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=petzysystem@gmail.com
spring.mail.password=rqdebifgrodxvrtx

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# ERROR HANDLING
# ============================================================

server.error.include-message=never
server.error.include-binding-errors=never