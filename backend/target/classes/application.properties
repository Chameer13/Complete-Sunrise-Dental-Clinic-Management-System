spring.application.name=sunrise-dental-backend
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/sunrise_dental_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Change this in production. Keep it long and random.
jwt.secret=SunriseDentalClinic-ChangeThisSecretKey-2026-ForProductionOnly-AtLeast32Chars
jwt.expiration-ms=86400000

server.error.include-message=never
server.error.include-binding-errors=never
